server:
  port: 8090
spring:
  application:
    name: loan-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loan_db}
    username: ${DB_USERNAME:banking360}
    password: ${DB_PASSWORD:banking360}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    enabled: false
  security:
    user:
      name: actuator
      password: ${ACTUATOR_PASSWORD:act}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
