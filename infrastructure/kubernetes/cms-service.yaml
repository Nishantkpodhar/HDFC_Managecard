apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms-service
  namespace: banking360
  labels:
    app: cms-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cms-service
  template:
    metadata:
      labels:
        app: cms-service
    spec:
      serviceAccountName: banking360-sa
      containers:
        - name: cms-service
          image: banking360/cms-service:latest
          ports:
            - containerPort: 8098
          env:
            - name: SERVER_PORT
              value: "8098"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8098
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cms-service
  namespace: banking360
spec:
  selector:
    app: cms-service
  ports:
    - port: 8098
      targetPort: 8098
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cms-service-hpa
  namespace: banking360
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cms-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cms-service-pdb
  namespace: banking360
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cms-service
