apiVersion: apps/v1
kind: Deployment
metadata:
  name: reward-service
  namespace: banking360
  labels:
    app: reward-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reward-service
  template:
    metadata:
      labels:
        app: reward-service
    spec:
      serviceAccountName: banking360-sa
      containers:
        - name: reward-service
          image: banking360/reward-service:latest
          ports:
            - containerPort: 8088
          env:
            - name: SERVER_PORT
              value: "8088"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reward-service
  namespace: banking360
spec:
  selector:
    app: reward-service
  ports:
    - port: 8088
      targetPort: 8088
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reward-service-hpa
  namespace: banking360
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reward-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reward-service-pdb
  namespace: banking360
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: reward-service
