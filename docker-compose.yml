# Banking360 local development stack (DEMO ONLY — fictional data).
# Infrastructure + all microservices + both micro-frontend shells.
# Run with: docker compose up --build
version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking360
      POSTGRES_USER: banking360
      POSTGRES_PASSWORD: banking360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking360"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking360

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - banking360

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banking360

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - banking360

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking360
      SPRING_DATASOURCE_USERNAME: banking360
      SPRING_DATASOURCE_PASSWORD: banking360
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVICE_PORT: '8080'
      SERVICE_IDENTITY_SERVICE_URL: http://identity-service:8081
      SERVICE_CUSTOMER_SERVICE_URL: http://customer-service:8082
      SERVICE_PRODUCT_SERVICE_URL: http://product-service:8083
      SERVICE_CARD_SERVICE_URL: http://card-service:8084
      SERVICE_TRANSACTION_SERVICE_URL: http://transaction-service:8085
      SERVICE_PAYMENT_SERVICE_URL: http://payment-service:8086
      SERVICE_LEDGER_SERVICE_URL: http://ledger-service:8087
      SERVICE_REWARD_SERVICE_URL: http://reward-service:8088
      SERVICE_EMI_SERVICE_URL: http://emi-service:8089
      SERVICE_LOAN_SERVICE_URL: http://loan-service:8090
      SERVICE_FASTAG_SERVICE_URL: http://fastag-service:8091
      SERVICE_OFFER_SERVICE_URL: http://offer-service:8092
      SERVICE_NOTIFICATION_SERVICE_URL: http://notification-service:8093
      SERVICE_SERVICE_REQUEST_SERVICE_URL: http://service-request-service:8094
      SERVICE_CONFIGURATION_SERVICE_URL: http://configuration-service:8095
