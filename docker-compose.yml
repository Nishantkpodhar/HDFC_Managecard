      SERVICE_AUDIT_SERVICE_URL: http://audit-service:8097
      SERVICE_CMS_SERVICE_URL: http://cms-service:8098
      SERVICE_ADMIN_SERVICE_URL: http://admin-service:8099
      SERVICE_REPORTING_SERVICE_URL: http://reporting-service:8100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
